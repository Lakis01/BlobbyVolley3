[package]
name = "blobby-volley-3"
version = "3.4.0"
edition = "2021"
authors = ["Lakis01", "Blobby Volley Community"]
license = "GPL-3.0-or-later"
description = "Unofficial Rust rewrite and remaster of Blobby Volley 2"

[[bin]]
name = "blobby"
path = "rust/src/main.rs"

[lib]
name = "blobby_core"
path = "rust/src/lib.rs"

[[test]]
name = "gameplay_tests"
path = "rust/tests/gameplay_tests.rs"

[[test]]
name = "network_tests"
path = "rust/tests/network_tests.rs"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
glam = "0.27"
quad-rand = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
opus-pure = "0.2.2"
ureq = "3.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
